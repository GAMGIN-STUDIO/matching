<svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">

  <defs>

    <linearGradient id="bg" x1="0" y1="0" x2="100" y2="100">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="55%" stop-color="#14532d"/>
      <stop offset="100%" stop-color="#1e3a8a"/>
    </linearGradient>

    <radialGradient id="glow1">
      <stop offset="0%" stop-color="#86efac" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#86efac" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glow2">
      <stop offset="0%" stop-color="#7dd3fc" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#7dd3fc" stop-opacity="0"/>
    </radialGradient>

    <filter id="blur">
      <feGaussianBlur stdDeviation="5"/>
    </filter>

  </defs>

  <!-- BACKGROUND -->
  <rect width="100" height="100" fill="url(#bg)"/>

  <!-- GLOWS (méně symetrické) -->
  <circle cx="20" cy="30" r="22" fill="url(#glow1)" filter="url(#blur)"/>
  <circle cx="65" cy="18" r="26" fill="url(#glow2)" filter="url(#blur)"/>
  <circle cx="85" cy="70" r="20" fill="url(#glow1)" filter="url(#blur)"/>

  <!-- MOUNTAINS (víc přírodní linie) -->
  <path d="M0 74
           L8 60
           L18 66
           L28 50
           L40 62
           L52 48
           L63 66
           L75 54
           L88 70
           L100 64
           L100 100
           L0 100Z"
        fill="#0f172a" opacity="0.55"/>

  <path d="M0 82
           L10 68
           L22 76
           L35 62
           L48 78
           L60 60
           L72 74
           L84 66
           L100 78
           L100 100
           L0 100Z"
        fill="#020617" opacity="0.6"/>

  <!-- FOREST (nepravidelný spacing + výšky) -->
  <g opacity="0.35">

    <path d="M6 89 L8 75 L10 89Z" fill="#052e16"/>
    <rect x="7.8" y="89" width="0.8" height="7" fill="#052e16"/>

    <path d="M15 92 L17 78 L19 92Z" fill="#052e16"/>
    <rect x="16.8" y="92" width="0.8" height="6" fill="#052e16"/>

    <path d="M29 88 L31 72 L33 88Z" fill="#052e16"/>
    <rect x="30.8" y="88" width="0.8" height="8" fill="#052e16"/>

    <path d="M44 93 L46 76 L48 93Z" fill="#052e16"/>
    <rect x="45.8" y="93" width="0.8" height="6" fill="#052e16"/>

    <path d="M58 90 L60 74 L62 90Z" fill="#052e16"/>
    <rect x="59.8" y="90" width="0.8" height="7" fill="#052e16"/>

    <path d="M73 88 L75 70 L77 88Z" fill="#052e16"/>
    <rect x="74.8" y="88" width="0.8" height="8" fill="#052e16"/>

    <path d="M87 92 L89 76 L91 92Z" fill="#052e16"/>
    <rect x="88.8" y="92" width="0.8" height="6" fill="#052e16"/>

  </g>

  <!-- CIRCLES -->
  <g opacity="0.08">
    <circle cx="12" cy="20" r="6"/>
    <circle cx="88" cy="26" r="8"/>
  </g>

  <!-- PARTICLES (lehce „random feel“) -->
  <g opacity="0.35">
    <circle cx="7" cy="16" r="0.4" fill="white"/>
    <circle cx="14" cy="28" r="0.5" fill="white"/>
    <circle cx="28" cy="14" r="0.4" fill="white"/>
    <circle cx="41" cy="31" r="0.4" fill="white"/>
    <circle cx="57" cy="18" r="0.5" fill="white"/>
    <circle cx="69" cy="27" r="0.4" fill="white"/>
    <circle cx="83" cy="13" r="0.4" fill="white"/>
    <circle cx="96" cy="24" r="0.4" fill="white"/>
  </g>

</svg>